<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>김병헌 · 박현지 — 결혼 알림장 💍</title>
<meta name="description" content="평생 함께 하고픈 반려자를 만나 결혼을 하게 되었습니다. 🌹">
<meta name="theme-color" content="#fffcf8">

<!-- ── Open Graph ── -->
<meta property="og:type"        content="website">
<meta property="og:title"       content="Byeongheon &amp; Hyunji's Wedding Announcement">
<meta property="og:description" content="저희 두 사람의 새로운 시작을 축복해 주세요. 화려한 예식 대신 가족들과의 작은 식사 자리로 서약을 대신합니다.">
<meta property="og:image"       content="og_image.jpg">
<meta property="og:image:width"  content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale"      content="ko_KR">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:site_name"   content="병헌 &amp; 현지 결혼 알림장">

<!-- ── Twitter / X Card ── -->
<meta name="twitter:card"        content="summary_large_image">
<meta name="twitter:title"       content="Byeongheon &amp; Hyunji's Wedding Announcement">
<meta name="twitter:description" content="저희 두 사람의 새로운 시작을 축복해 주세요.">
<meta name="twitter:image"       content="og_image.jpg">

<!-- ── KakaoTalk (reads og: tags — keep title ≤45 chars, desc ≤80 chars) ── -->
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="is-ko is-locked">

<!-- ═══ INTRO POPUP OVERLAY ═══ -->
<div id="introOverlay" role="dialog" aria-modal="true">
  <div id="introContent">
    <div class="popup-main">
      <span class="popup-title-ko ko" id="introTitleKo"></span>
      <span class="popup-title-en en" id="introTitleEn"></span>
    </div>
  </div>
</div>


<div id="topControls">
  <!-- LANG PILL -->
  <div id="langPill">
    <button class="lpBtn on" id="bKo"></button>
    <button class="lpBtn" id="bEn"></button>
  </div>

  <!-- MUSIC -->
  <audio id="bgMusic" loop preload="none">
    <source src="assets/audio/when-you-so-in-loveAcoustic-Guitar--Piano-Ballad-Type-Beat.mp3" type="audio/mpeg">
  </audio>
  <div id="musicPill">
    <button id="musicBtn">
      <img id="iPlay" src="assets/icons/music-play.svg" width="12" height="12" alt="" aria-hidden="true">
      <img id="iPause" src="assets/icons/music-pause.svg" width="12" height="12" alt="" aria-hidden="true">
      <span class="ko" id="musicLabelKo"></span><span class="en" id="musicLabelEn"></span>
      <span class="mbars"><span></span><span></span><span></span></span>
    </button>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lb">
  <button id="lb-close">&#x2715;</button>
  <button id="lb-prev">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next">&#8250;</button>
  <div id="lb-ctr"></div>
</div>

<!-- ═══ HERO ═══ -->
<section id="hero">
  <img class="hero-img" id="heroPhoto" src="" alt="">
  <canvas id="blossom"></canvas>
  <div class="hero-grad"></div>
  <div class="hero-top">
    <div class="hero-eye ko" id="heroEyeKo"></div>
    <div class="hero-eye en" id="heroEyeEn"></div>
  </div>
  <div class="hero-bot">
    <div>
      <span class="h-name-ko ko" id="heroNameKo"></span>
      <span class="h-name-en en" id="heroNameEn"></span>
    </div>
    <div class="h-date">
      <div class="h-dl"></div>
      <span class="h-dt ko" id="heroDateKo"></span>
      <span class="h-dt en" id="heroDateEn"></span>
      <div class="h-dl"></div>
    </div>
    <div class="scroll-cue">
      <img class="scroll-icon" src="assets/icons/scroll-down.svg" alt="" aria-hidden="true">
    </div>
  </div>
</section>

<!-- ═══ MESSAGE ═══ -->
<section class="sec rv" id="guestbookSection">
  <div class="rings-orn">
    <img class="rings-icon" src="assets/icons/rings.svg" width="50" height="30" alt="" aria-hidden="true">
  </div>
  <div class="ko" id="messageKo"></div>
  <div class="en" id="messageEn"></div>
</section>

<!-- ═══ DATE ═══ -->
<section class="styled-date-sec rv">
  <div class="ko" id="dateSectionKo"></div>
  <div class="en" id="dateSectionEn"></div>
</section>

<!-- ═══ PARENTS ═══ -->
<section class="parents-sec rv ko" id="parentsKo"></section>


<!-- ═══ ABOUT US ═══ -->
<section class="sec alt rv">
  <span class="slabel ko" id="aboutLabelKo"></span>
  <span class="slabel en" id="aboutLabelEn"></span>
  <div class="about-stack">
    <div class="about-card about-card--merged rv rv1">
      <div class="about-pair-title ko" id="about1PairTitleKo"></div>
      <div class="about-pair-title en" id="about1PairTitleEn"></div>
      <img class="about-photo" id="aboutPhoto1" src="" alt="">
      <div class="about-pair-quote ko" id="about1PairQuoteKo"></div>
      <div class="about-pair-quote en" id="about1PairQuoteEn"></div>
    </div>
    <div class="about-card about-card--merged rv rv2">
      <div class="about-pair-title ko" id="about2PairTitleKo"></div>
      <div class="about-pair-title en" id="about2PairTitleEn"></div>
      <img class="about-photo" id="aboutPhoto2" src="" alt="">
      <div class="about-pair-quote ko" id="about2PairQuoteKo"></div>
      <div class="about-pair-quote en" id="about2PairQuoteEn"></div>
    </div>
  </div>
</section>

<!-- ═══ GALLERY ═══ -->
<section id="gallery" class="sec">
  <div class="gal-hdr rv">
    <span class="slabel ko" id="galleryLabelKo"></span>
    <span class="slabel en" id="galleryLabelEn"></span>
  </div>
  <div class="gal-grid rv rv1" id="gal-container"></div>
  <div class="gal-more-wrap rv">
    <button class="more-btn" id="moreBtn" data-state="more">
      <img class="more-icon" src="assets/icons/chevron-down.svg" alt="" aria-hidden="true">
      <span class="more-label">
        <span class="ko more-text is-more" id="moreLabelMoreKo"></span>
        <span class="ko more-text is-less" id="moreLabelLessKo"></span>
        <span class="en more-text is-more" id="moreLabelMoreEn"></span>
        <span class="en more-text is-less" id="moreLabelLessEn"></span>
      </span>
    </button>
  </div>
</section>


<!-- ═══ GUESTBOOK ═══ -->
<section class="sec rv">
  <span class="slabel ko" id="guestbookLabelKo"></span>
  <span class="slabel en" id="guestbookLabelEn"></span>
  <div class="msg-empty" id="msgEmpty">
    <p class="ko" id="guestbookEmptyKo"></p>
    <p class="en" id="guestbookEmptyEn"></p>
  </div>
  <div class="wwall" id="wwall"></div>
  <div class="guestbook-all" id="guestAllPanel">
    <div class="guestbook-all-head">
      <div class="guestbook-all-title" id="guestAllTitleWrap">
        <span class="ko" id="guestAllTitleKo"></span>
        <span class="en" id="guestAllTitleEn"></span>
      </div>
    </div>
    <div class="wwall guestbook-all-list" id="guestAllList"></div>
    <div class="guestbook-pager">
      <button class="guestbook-page-btn" id="guestPrevBtn" type="button">Prev</button>
      <div class="guestbook-page-info" id="guestPageInfo">1 / 1</div>
      <button class="guestbook-page-btn" id="guestNextBtn" type="button">Next</button>
    </div>
  </div>
  <div class="guestbook-actions">
    <button class="guestbook-toggle" id="guestOpenAllBtn" type="button">
      <span class="ko" id="guestOpenAllKo"></span>
      <span class="en" id="guestOpenAllEn"></span>
    </button>
  </div>
  <div class="wform">
    <div class="wform-title ko" id="guestbookFormTitleKo"></div>
    <div class="wform-title en" id="guestbookFormTitleEn"></div>
    <div class="ff">
      <label class="ko" id="guestNameLabelKo"></label><label class="en" id="guestNameLabelEn"></label>
      <input type="text" id="gName" placeholder="">
    </div>
    <div class="ff">
      <label class="ko" id="guestRelLabelKo"></label><label class="en" id="guestRelLabelEn"></label>
      <input type="text" id="gRel" placeholder="">
    </div>
    <div class="ff">
      <label class="ko" id="guestSideLabelKo"></label><label class="en" id="guestSideLabelEn"></label>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="side" value="bride" checked>
          <span class="ko" id="guestSideBrideKo"></span><span class="en" id="guestSideBrideEn"></span>
        </label>
        <label class="radio-label">
          <input type="radio" name="side" value="groom">
          <span class="ko" id="guestSideGroomKo"></span><span class="en" id="guestSideGroomEn"></span>
        </label>
      </div>
    </div>
    <div class="ff ff--compact-top">
      <label class="ko" id="guestMsgLabelKo"></label><label class="en" id="guestMsgLabelEn"></label>
      <textarea id="gMsg" placeholder=""></textarea>
    </div>
    <div class="ff">
      <label class="ko" id="guestPasswordLabelKo"></label><label class="en" id="guestPasswordLabelEn"></label>
      <input type="password" id="gPassword" placeholder="">
    </div>
    <button class="sbtn" id="guestSubmitBtn">
      <span class="ko" id="guestSubmitKo"></span><span class="en" id="guestSubmitEn"></span>
    </button>
  </div>
</section>

<!-- ═══ GIFTS KO ═══ -->
<section class="sec alt ko rv" id="giftsKoSection">
  <span class="slabel" id="giftLabelKo"></span>
  <p class="gift-intro" id="giftIntroKo"></p>
  <div class="accordion" id="acc-bride">
    <div class="acc-head">
      <span id="accBrideHead"></span>
      <span class="acc-chev">&#9662;</span>
    </div>
    <div class="acc-body">
      <div class="acc-row">
        <div class="acc-row-info">
          <span class="acc-bank" id="accBrideBank"></span>
          <div><span class="acc-number" id="accBrideNumber"></span><span class="acc-name" id="accBrideName"></span></div>
        </div>
        <button class="cbtn" id="accBrideCopyBtn"></button>
      </div>
    </div>
  </div>
  <div class="accordion" id="acc-groom">
    <div class="acc-head">
      <span id="accGroomHead"></span>
      <span class="acc-chev">&#9662;</span>
    </div>
    <div class="acc-body">
      <div class="acc-row">
        <div class="acc-row-info">
          <span class="acc-bank" id="accGroomBank"></span>
          <div><span class="acc-number" id="accGroomNumber"></span><span class="acc-name" id="accGroomName"></span></div>
        </div>
        <button class="cbtn" id="accGroomCopyBtn"></button>
      </div>
      <div class="acc-row" id="accGroomExtraRow" style="display:none;">
        <div class="acc-row-info">
          <span class="acc-bank" id="accGroomExtraBank"></span>
          <div><span class="acc-number" id="accGroomExtraNumber"></span><span class="acc-name" id="accGroomExtraName"></span></div>
        </div>
        <button class="cbtn" id="accGroomExtraCopyBtn"></button>
      </div>
    </div>
  </div>
</section>

<!-- ═══ GIFTS EN ═══ -->
<section class="sec alt en rv" id="giftsEnSection">
  <span class="slabel" id="giftLabelEn"></span>
  <div class="en-gift-intro-box">
    <div class="en-gift-title" id="giftTitleEn"></div>
    <div class="en-gift-text" id="giftTextEn"></div>
  </div>
  <div class="venmo-box">
    <div class="venmo-id" id="venmoId"></div>
    <button class="cbtn cbtn--venmo" id="venmoCopyBtn"></button>
  </div>
</section>

<!-- ═══ FOOTER ═══ -->
<footer class="footer-quote rv">
  <div class="ko" id="footerKo"></div>
  <div class="en" id="footerEn"></div>
</footer>

<div id="toast"></div>

<script src="content.js"></script>
<script src="photos.js"></script>
<script src="app.js"></script>
</body>
</html>
